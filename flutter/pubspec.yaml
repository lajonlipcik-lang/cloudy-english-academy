name: cloudy_english
description: Cloudy English Academy Flutter application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.9.1
  http: ^1.3.0
  audioplayers: ^6.8.1
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cloudy_catalog.json
