<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Cloudy Shorts — съёмка</title>
<style>
:root{--ac:#5bb8ff;--ac2:#2f7bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;background:#000;overscroll-behavior:none}
body{display:flex;justify-content:center;color:#fff;font-family:Inter,"SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg.i{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;background:#000;display:flex;flex-direction:column;overflow:hidden}
.top{height:calc(64px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 14px 0;display:flex;align-items:center;flex:none}
.top .x{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.pv{position:relative;flex:1;min-height:0;border-radius:26px;overflow:hidden;background:radial-gradient(120% 90% at 50% 20%,#14213f 0%,#070b17 70%)}
.hero{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:0 36px 60px}
.hero svg{width:min(52vw,220px);filter:drop-shadow(0 8px 22px rgba(120,190,255,.45));animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:bk 4.5s infinite}
@keyframes bk{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.hero b{font-size:20px}.hero small{color:#9fb3d9;font-size:15px;line-height:1.4}
.txtmode{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:2;padding:30px 30px 70px}
.txtmode.on{display:flex}
.txtmode textarea{width:100%;height:60%;background:transparent;border:0;outline:0;resize:none;color:#fff;font-weight:800;font-size:34px;line-height:1.25;font-family:inherit;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.25);-webkit-user-select:text;user-select:text}
.txtmode textarea::placeholder{color:rgba(255,255,255,.6)}
.bgdot{position:absolute;left:16px;bottom:64px;width:36px;height:36px;border-radius:50%;border:3px solid #fff;z-index:3;display:none}
.txtmode.on ~ .bgdot{display:block}
.modes{position:absolute;left:0;right:0;bottom:10px;display:flex;gap:4px;overflow-x:auto;padding:0 50%;scrollbar-width:none;scroll-snap-type:x proximity;z-index:3}
.modes::-webkit-scrollbar{display:none}
.mode{flex:none;padding:9px 16px;border-radius:999px;font-weight:800;font-size:16px;scroll-snap-align:center;white-space:nowrap;text-shadow:0 1px 4px #000a}
.mode.sel{background:#fff;color:#000;text-shadow:none}
.shrow{flex:none;height:112px;display:flex;align-items:center;justify-content:center;padding-top:6px}
.shut{width:96px;height:96px;border-radius:50%;border:5px solid #fff;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.shut:active{transform:scale(.94)}
.shut .cl{width:58px;height:auto;overflow:visible}
.shut .cl path{fill:rgba(255,255,255,.14);stroke:rgba(255,255,255,.9);stroke-width:3;stroke-linejoin:round;transition:fill .15s,stroke .15s,filter .15s}
.shut:active .cl path,.shut.pressed .cl path{fill:#5bb8ff;stroke:#bfe6ff;filter:drop-shadow(0 0 8px rgba(91,184,255,.8))}
.nav{flex:none;height:calc(76px + env(safe-area-inset-bottom));padding:6px 18px env(safe-area-inset-bottom);display:flex;align-items:center;position:relative}
.gal{position:absolute;left:18px;top:50%;transform:translateY(-62%);width:52px;height:52px;border-radius:10px;border:3px solid #fff;background:#12285c center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:20px}
.tabs{display:flex;margin:0 auto;gap:34px;padding-left:44px;font-weight:800;font-size:19px}
.tabs button{opacity:.55}.tabs button.on{opacity:1}
.rv{position:absolute;inset:0;background:#000;z-index:30;display:none;flex-direction:column}
.rv.on{display:flex}
.rv .m{flex:1;min-height:0;position:relative;margin-top:calc(8px + env(safe-area-inset-top));border-radius:26px;overflow:hidden;background:#111}
.rv video,.rv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rv .bar{display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.btn{flex:1;height:50px;border-radius:14px;font-weight:700;font-size:16px;background:#2a2a2a;display:flex;align-items:center;justify-content:center}
.btn.main{background:linear-gradient(135deg,var(--ac),var(--ac2))}
.toast{position:absolute;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-90px);background:#fff;color:#0a2a73;padding:11px 16px;border-radius:14px;font-weight:700;z-index:50;transition:transform .3s;max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0)}
.hid{display:none!important}
</style></head><body>
<div class="app video" id="app">
  <div class="top"><button class="x" id="xBtn" aria-label="Закрыть"><svg class="i" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
  <div class="pv">
    <div class="hero" id="hero">
      <svg viewBox="0 0 100 80"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#bfe0ff"/></linearGradient></defs>
        <path d="M26 68a18 18 0 0 1-2-37 24 24 0 0 1 46-6 20 20 0 0 1 6 43z" fill="url(#gb)"/>
        <g class="eyes"><circle cx="40" cy="45" r="5" fill="#06143a"/><circle cx="62" cy="45" r="5" fill="#06143a"/><circle cx="42" cy="43" r="1.8" fill="#fff"/><circle cx="64" cy="43" r="1.8" fill="#fff"/></g>
        <path d="M44 54q7 8 14 0" stroke="#06143a" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="31" cy="55" r="4" fill="#ff9fb0" opacity=".55"/><circle cx="71" cy="55" r="4" fill="#ff9fb0" opacity=".55"/></svg>
      <b id="hT">Сними видео</b><small id="hS">Нажми на большую кнопку. Откроется камера телефона, сайт к ней доступа не получает.</small>
    </div>
    <div class="txtmode" id="txtmode"><textarea id="txt" maxlength="220" placeholder="Напиши, что хочешь сказать…"></textarea></div>
    <button class="bgdot" id="bgdot" aria-label="Фон"></button>
    <div class="modes" id="modes"></div>
  </div>
  <div class="shrow"><button class="shut" id="shut" aria-label="Снять"><svg class="cl" viewBox="0 0 100 80" aria-hidden="true"><path d="M26 68a18 18 0 0 1-2-37 24 24 0 0 1 46-6 20 20 0 0 1 6 43z"/></svg></button></div>
  <div class="nav">
    <button class="gal" id="gal" aria-label="Галерея">☁️</button>
    <div class="tabs"><button data-n="stream">СТРИМ</button><button class="on" data-n="camera">КАМЕРА</button></div>
  </div>
  <input type="file" id="capV" accept="video/*" capture class="hid">
  <input type="file" id="capP" accept="image/*" capture class="hid">
  <input type="file" id="gfile" accept="video/mp4,video/quicktime,video/webm,image/*,.mp4,.mov,.webm" class="hid">
  <div class="rv" id="rv"><div class="m"><video id="rvVid" playsinline loop autoplay></video><img id="rvImg" alt=""></div>
    <div class="bar"><button class="btn" id="rvBack">‹ Назад</button><button class="btn main" id="rvNext">Далее ›</button></div></div>
  <div class="toast" id="toast"></div>
</div>
<script>
const $=id=>document.getElementById(id), app=$('app');
const S={mode:'v15',bg:0,last:null,url:null};
const MAX_MB=100;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}
const MODES=[{id:'v180',l:'3 мин',max:180},{id:'v60',l:'60 с',max:60},{id:'v15',l:'15 с',max:15},{id:'photo',l:'ФОТО'},{id:'text',l:'ТЕКСТ'}];
const mode=()=>MODES.find(m=>m.id===S.mode);
function renderModes(){
 $('modes').innerHTML=MODES.map(m=>'<button class="mode '+(m.id===S.mode?'sel':'')+'" data-m="'+m.id+'">'+m.l+'</button>').join('');
 const sel=$('modes').querySelector('.sel');sel&&sel.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
 const t=S.mode==='text',p=S.mode==='photo';
 app.classList.toggle('text',t);app.classList.toggle('video',!t&&!p);
 $('txtmode').classList.toggle('on',t);$('hero').classList.toggle('hid',t);
 $('hT').textContent=p?'Сделай фото':'Сними видео';
 $('hS').textContent=p?'Нажми на большую кнопку, чтобы сделать фото.':'Нажми на большую кнопку. Откроется камера телефона, сайт к ней доступа не получает.';
}
$('modes').addEventListener('click',e=>{const b=e.target.closest('.mode');if(b){S.mode=b.dataset.m;renderModes()}});
const shutEl=$('shut');
shutEl.addEventListener('pointerdown',()=>shutEl.classList.add('pressed'));
['pointerup','pointercancel','pointerleave'].forEach(ev=>shutEl.addEventListener(ev,()=>setTimeout(()=>shutEl.classList.remove('pressed'),350)));
$('shut').onclick=()=>{
 const m=mode();
 if(m.id==='text'){if(!$('txt').value.trim()){toast('Сначала напиши текст');return}renderText();return}
 (m.id==='photo'?$('capP'):$('capV')).click();
};
$('gal').onclick=()=>$('gfile').click();
['capV','capP','gfile'].forEach(id=>$(id).addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)handle(f)}));
function handle(f){
 const isImg=f.type.startsWith('image/'),isVid=f.type.startsWith('video/')||/\.(mp4|mov|webm)$/i.test(f.name);
 if(!isImg&&!isVid){toast('Нужен файл видео или фото');return}
 if(isImg&&f.size>15*1024*1024){toast('Фотография должна быть не больше 15 МБ');return}
 if(!isImg&&f.size>MAX_MB*1024*1024){toast('Видео больше 100 МБ');return}
 if(isImg&&!['image/jpeg','image/png','image/webp'].includes(f.type)){toast('Поддерживаются JPG, PNG и WebP');return}
 if(isImg){if(S.url)URL.revokeObjectURL(S.url);review(f,'photo',0);return}
 const url=URL.createObjectURL(f),v=document.createElement('video');v.preload='metadata';v.muted=true;
 const limit=mode().max||180;
 v.onloadedmetadata=()=>{const d=v.duration||0;URL.revokeObjectURL(url);
  if(!Number.isFinite(d)||d<=0){toast('Не удалось определить длительность видео. Выбери другой файл.');return}
  if(d>limit+.5){toast('Видео длиннее '+(limit>=60?limit/60+' мин':limit+' с')+'. Выбери режим подлиннее.');return}
  review(f,'video',d)};
 v.onerror=()=>{URL.revokeObjectURL(url);toast('Не удалось прочитать длительность видео. Попробуй другой файл.')};
 v.src=url;
}
const BGS=[['#2f7bff','#5bb8ff'],['#7c3aed','#ec4899'],['#0f766e','#22d3ee'],['#ea580c','#facc15'],['#111827','#374151']];
function setBg(){const b=BGS[S.bg%BGS.length];$('txtmode').style.background='linear-gradient(160deg,'+b[0]+','+b[1]+')';$('bgdot').style.background='linear-gradient(135deg,'+b[0]+','+b[1]+')'}
$('bgdot').onclick=()=>{S.bg++;setBg()};
function renderText(){
 const T=1080,V=1920,k=document.createElement('canvas');k.width=T;k.height=V;const x=k.getContext('2d'),b=BGS[S.bg%BGS.length];
 const g=x.createLinearGradient(0,0,T*.5,V);g.addColorStop(0,b[0]);g.addColorStop(1,b[1]);x.fillStyle=g;x.fillRect(0,0,T,V);
 x.fillStyle='#fff';x.font='800 84px Inter,system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.shadowColor='rgba(0,0,0,.25)';x.shadowBlur=16;
 const lines=[];$('txt').value.trim().split('\n').forEach(p=>{let cur='';p.split(' ').forEach(w=>{const t=cur?cur+' '+w:w;if(x.measureText(t).width>900&&cur){lines.push(cur);cur=w}else cur=t});lines.push(cur)});
 const lh=108,y0=V/2-(lines.length-1)*lh/2;lines.forEach((l,i)=>x.fillText(l,T/2,y0+i*lh));
 k.toBlob(bl=>{if(!bl){toast('Не удалось подготовить текстовую публикацию');return}review(new File([bl],'cloudy-'+Date.now()+'.jpg',{type:'image/jpeg'}),'text',0,k.toDataURL('image/jpeg',.3))},'image/jpeg',.92);
}
function review(file,type,dur,thumb){
 S.last={file,type,dur,thumb};if(S.url)URL.revokeObjectURL(S.url);S.url=URL.createObjectURL(file);
 const v=$('rvVid'),i=$('rvImg');if(type==='video'){i.style.display='none';v.style.display='block';v.src=S.url;v.play().catch(()=>{})}
 else{v.pause();v.style.display='none';i.style.display='block';i.src=S.url}
 $('rv').classList.add('on');
}
$('rvBack').onclick=()=>{$('rvVid').pause();$('rv').classList.remove('on');if(S.url){URL.revokeObjectURL(S.url);S.url=null}S.last=null};
$('rvNext').onclick=()=>{
 const d=S.last;if(!d)return;$('rvVid').pause();
 const parent=window.parent||window;
 const ok=parent.dispatchEvent(new CustomEvent('cloudy:captured',{detail:{file:d.file,type:d.type,duration:d.dur},cancelable:true}));
 $('rv').classList.remove('on');
 if(ok)toast('Не удалось открыть экран публикации. Попробуй ещё раз.');
};
$('xBtn').onclick=()=>{const parent=window.parent||window;if(parent.dispatchEvent(new CustomEvent('cloudy:close',{cancelable:true})))toast('Не удалось закрыть экран.');};
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.n==='camera')return;const parent=window.parent||window;if(parent.dispatchEvent(new CustomEvent('cloudy:nav',{detail:b.dataset.n,cancelable:true})))toast('Скоро будет доступно')});
window.addEventListener('pagehide',()=>{if(S.url)URL.revokeObjectURL(S.url)});
setBg();renderModes();
</script><script>
(function(){
 const KEY="cloudy-ui-v1";
 const T={"Cloudy Shorts — съёмка":["Cloudy Shorts — Recording","Cloudy Shorts — Запис"],"Закрыть":["Close","Закрити"],"Сними видео":["Record a video","Зніми відео"],"Нажми на большую кнопку. Откроется камера телефона, сайт к ней доступа не получает.":["Tap the large button to open your phone’s camera. The website does not access it directly.","Натисни велику кнопку, щоб відкрити камеру телефона. Сайт не отримує до неї прямого доступу."],"Напиши, что хочешь сказать…":["Write what you want to say…","Напиши, що хочеш сказати…"],"Фон":["Background","Тло"],"Снять":["Record","Записати"],"СТРИМ":["LIVE","СТРІМ"],"КАМЕРА":["CAMERA","КАМЕРА"],"3 мин":["3 min","3 хв"],"60 с":["60 sec","60 с"],"15 с":["15 sec","15 с"],"ФОТО":["PHOTO","ФОТО"],"ТЕКСТ":["TEXT","ТЕКСТ"],"Сделай фото":["Take a photo","Зроби фото"],"Нажми на большую кнопку, чтобы сделать фото.":["Tap the large button to take a photo.","Натисни велику кнопку, щоб зробити фото."],"Сначала напиши текст":["Write some text first","Спочатку напиши текст"],"Нужен файл видео или фото":["Choose a video or photo file","Потрібен файл відео або фото"],"Фотография должна быть не больше 15 МБ":["Photo must be 15 MB or smaller","Фото має бути не більше 15 МБ"],"Видео больше 100 МБ":["Video is larger than 100 MB","Відео більше 100 МБ"],"Поддерживаются JPG, PNG и WebP":["JPG, PNG, and WebP are supported","Підтримуються JPG, PNG і WebP"],"Не удалось определить длительность видео. Выбери другой файл.":["Could not determine the video duration. Choose another file.","Не вдалося визначити тривалість відео. Вибери інший файл."],"Видео длиннее ":["Video is longer than ","Відео довше "],"Не удалось прочитать длительность видео. Попробуй другой файл.":["Could not read the video duration. Try another file.","Не вдалося прочитати тривалість відео. Спробуй інший файл."],"Не удалось подготовить текстовую публикацию":["Could not prepare the text post","Не вдалося підготувати текстову публікацію"],"Назад":["Back","Назад"],"Далее ›":["Next ›","Далі ›"],"Не удалось открыть экран публикации. Попробуй ещё раз.":["Could not open the publishing screen. Try again.","Не вдалося відкрити екран публікації. Спробуй ще раз."],"Не удалось закрыть экран.":["Could not close the screen.","Не вдалося закрити екран."],"Скоро будет доступно":["Coming soon","Незабаром буде доступно"],"Галерея":["Gallery","Галерея"],"мин":["min","хв"],"Выбери режим подлиннее.":["Choose a longer mode.","Обери довший режим."]};
 let lang="ru";
 try{lang=JSON.parse(localStorage.getItem(KEY)||"{}").lang||"ru"}catch(e){}
 if(!["ru","en","uk"].includes(lang))lang="ru";
 let col=lang==="en"?0:lang==="uk"?1:-1;
 const translateTitle=()=>{const title=document.querySelector("title");if(title){const v=T[title.textContent];if(v&&col>=0)title.textContent=v[col]}};
 const translateAttributes=(el)=>{
  if(!el||el.nodeType!==1)return;
  ["placeholder","aria-label","title"].forEach(a=>{
   const current=el.getAttribute(a),v=current&&T[current];
   if(v&&col>=0&&v[col]&&v[col]!==current)el.setAttribute(a,v[col]);
  });
 };
 const translateText=(node)=>{
  if(!node||node.nodeType!==3||!node.parentElement)return;
  const tag=node.parentElement.tagName;
  if(tag==="SCRIPT"||tag==="STYLE"||tag==="TEXTAREA")return;
  const raw=node.nodeValue||"",trim=raw.trim(),v=T[trim];
  let out=v&&col>=0?v[col]:null;
  const over=trim.match(/^Видео длиннее (.+)\\. Выбери режим подлиннее\\.$/);
  if(!out&&over){const duration=over[1].replace(/ мин$/," min").replace(/ с$/," sec");out=lang==="en"?"Video exceeds "+duration+". Choose a longer mode.":"Відео довше за "+duration.replace(/ min$/," хв").replace(/ sec$/," с")+". Обери довший режим."}
  if(out&&out!==trim)node.nodeValue=raw.replace(trim,out);
 };
 const translateSubtree=(root)=>{
  if(!root)return;
  if(root.nodeType===3){translateText(root);return}
  if(root.nodeType!==1&&root.nodeType!==9&&root.nodeType!==11)return;
  if(root.nodeType===1)translateAttributes(root);
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);
  let node;
  while((node=walker.nextNode())){
   if(node.nodeType===1)translateAttributes(node);
   else translateText(node);
  }
 };
 const pending=new Set();
 let scheduled=false,busy=false;
 const flush=()=>{
  scheduled=false;
  if(busy||!pending.size)return;
  busy=true;
  observer.disconnect();
  try{const batch=Array.from(pending);pending.clear();batch.forEach(translateSubtree)}
  finally{observer.takeRecords();busy=false;observer.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:["placeholder","aria-label","title"]})}
  if(pending.size&&!scheduled){scheduled=true;requestAnimationFrame(flush)}
 };
 const observer=new MutationObserver(records=>{
  if(busy)return;
  records.forEach(record=>{
   if(record.type==="childList")record.addedNodes.forEach(node=>pending.add(node));
   else pending.add(record.target);
  });
  if(pending.size&&!scheduled){scheduled=true;requestAnimationFrame(flush)}
 });
 translateTitle();
 translateSubtree(document.body);
 observer.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:["placeholder","aria-label","title"]});
 window.addEventListener("storage",e=>{if(e.key===KEY)location.reload()});
 window.addEventListener("cloudy:languagechange",e=>{const l=e.detail?.language;if(["ru","en","uk"].includes(l)){lang=l;location.reload()}});
})();
</script></body></html>
