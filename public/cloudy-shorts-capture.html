<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Cloudy Shorts — съёмка</title><style>
:root{--ac:#5bb8ff;--ac2:#2f7bff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}html,body{height:100%;margin:0;background:#050c24;color:#fff;font-family:Inter,"SF Pro Display",system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow:hidden}.app{height:100dvh;max-width:480px;margin:auto;background:#050c24;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));gap:12px}.top{height:42px;display:flex;align-items:center;justify-content:space-between}.top b{font-size:16px}.x{width:40px;height:40px;border:0;border-radius:50%;background:#ffffff18;color:#fff;font-size:25px}.pv{position:relative;flex:1;min-height:190px;border-radius:22px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#173c67,#0a1831 70%);display:grid;place-items:center}.hero{text-align:center;padding:20px}.cloud{font-size:82px;filter:drop-shadow(0 0 22px #5bb8ff88);animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px)}}.hero b{display:block;font-size:18px;margin:10px}.hero small{color:#b9cce0;line-height:1.4}.txtmode{display:none;width:100%;height:100%;padding:14px}.txtmode textarea{width:100%;height:100%;resize:none;background:#10213c;color:#fff;border:1px solid #315477;border-radius:16px;padding:18px;font:600 20px/1.5 system-ui;outline:none}.bgdot{position:absolute;right:14px;top:14px;border:0;border-radius:50%;width:34px;height:34px;background:#ffffff24;color:white}.modes{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.modes button{border:0;border-radius:20px;padding:9px 13px;background:#1c3150;color:#c7d7e8;font-weight:800;font-size:12px}.modes button.active{background:#fff;color:#10213c}.controls{height:84px;display:flex;align-items:center;justify-content:center;gap:32px}.gallery{width:50px;height:50px;border:1px solid #8ca9c8;border-radius:13px;background:#1b304c;color:white;font-size:22px}.shutter{width:76px;height:76px;border:5px solid white;border-radius:50%;background:transparent;display:grid;place-items:center}.shutter span{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2))}.rv{position:fixed;inset:0;z-index:5;background:#050c24;display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));gap:14px}.rv.show{display:flex}.preview{flex:1;min-height:0;border-radius:20px;background:#000;overflow:hidden;display:grid;place-items:center}.preview video,.preview img{width:100%;height:100%;object-fit:contain}.actions{display:flex;gap:12px}.actions button{height:52px;border:0;border-radius:15px;font-weight:850;flex:1;background:#203957;color:#fff}.actions #rvNext{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#041326}.toast{position:fixed;bottom:20px;left:20px;right:20px;text-align:center;background:#263a54;padding:12px;border-radius:12px;opacity:0}.toast.show{opacity:1}.hidden{display:none!important}
</style></head><body><main class="app"><header class="top"><button class="x" id="xBtn">×</button><b>Cloudy Shorts</b><span style="width:40px"></span></header><section class="pv"><div class="hero" id="hero"><div class="cloud">☁</div><b id="hT">Создай свой Shorts</b><small id="hS">Сними видео или выбери его из галереи</small></div><div class="txtmode" id="txtmode"><textarea id="txt" maxlength="500" placeholder="Напиши текст публикации…"></textarea></div><button class="bgdot" id="bgdot">◐</button></section><nav class="modes" id="modes"><button data-mode="v180">3 мин</button><button data-mode="v60">60 с</button><button class="active" data-mode="v15">15 с</button><button data-mode="photo">ФОТО</button><button data-mode="text">ТЕКСТ</button></nav><div class="controls"><button class="gallery" id="gal">▧</button><button class="shutter" id="shut"><span></span></button><span style="width:50px"></span></div><input id="capV" type="file" accept="video/*" capture="environment" hidden><input id="capP" type="file" accept="image/*" capture="environment" hidden><input id="gfile" type="file" accept="video/*,image/*" hidden></main><section class="rv" id="rv"><header class="top"><button class="x" id="rvBack">‹</button><b>Предпросмотр</b><span style="width:40px"></span></header><div class="preview"><video id="rvVid" playsinline controls hidden></video><img id="rvImg" hidden></div><div class="actions"><button id="rvCancel">Назад</button><button id="rvNext">Далее</button></div></section><div class="toast" id="toast"></div>
<script>(()=>{const $=id=>document.getElementById(id),S={mode:"v15",bg:0,last:null,url:null};const lim={v15:15,v60:60,v180:180};function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2200)}function clear(){if(S.url)URL.revokeObjectURL(S.url);S.url=null;S.last=null;$("rvVid").pause();$("rvVid").removeAttribute("src");$("rvImg").removeAttribute("src")}function review(file,type,duration){clear();S.last={file,type,duration};S.url=URL.createObjectURL(file);$("rvVid").hidden=type!=="video";$("rvImg").hidden=type==="video";if(type==="video")$("rvVid").src=S.url;else $("rvImg").src=S.url;$("rv").classList.add("show")}function handle(f){if(!f)return;const image=f.type.startsWith("image/");if(image){if(!["image/jpeg","image/png","image/webp"].includes(f.type)||f.size>15*1024*1024){toast("JPG, PNG или WebP до 15 МБ");return}review(f,S.mode==="text"?"text":"photo",0);return}if(!f.type.startsWith("video/")||f.size>100*1024*1024){toast("Видео должно быть до 100 МБ");return}const v=document.createElement("video");v.preload="metadata";const url=URL.createObjectURL(f);v.onloadedmetadata=()=>{const d=v.duration;URL.revokeObjectURL(url);if(!Number.isFinite(d)||d<=0){toast("Не удалось определить длительность");return}if(d>(lim[S.mode]||180)+.5){toast("Видео длиннее выбранного режима");return}review(f,"video",d)};v.onerror=()=>{URL.revokeObjectURL(url);toast("Не удалось прочитать видео")};v.src=url}function mode(m){S.mode=m;document.querySelectorAll(".modes button").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));$("txtmode").style.display=m==="text"?"block":"none";$("hero").style.display=m==="text"?"none":"block";$("bgdot").classList.toggle("hidden",m!=="text");$("hT").textContent=m==="photo"?"Добавь фотографию":"Создай свой Shorts";$("hS").textContent=m==="photo"?"Сними фото или выбери из галереи":"Сними видео или выбери его из галереи"}document.querySelectorAll(".modes button").forEach(b=>b.onclick=()=>mode(b.dataset.mode));$("gal").onclick=()=>{$("gfile").accept=S.mode==="photo"||S.mode==="text"?"image/*":"video/*,image/*";$("gfile").click()};$("gfile").onchange=e=>handle(e.target.files[0]);$("capV").onchange=e=>handle(e.target.files[0]);$("capP").onchange=e=>handle(e.target.files[0]);$("shut").onclick=()=>{if(S.mode==="photo")$("capP").click();else if(S.mode!=="text")$("capV").click();else{const value=$("txt").value.trim();if(!value){toast("Напиши текст публикации");return}const c=document.createElement("canvas");c.width=1080;c.height=1920;const x=c.getContext("2d");x.fillStyle=["#08152d","#102a4c","#101018"][S.bg%3];x.fillRect(0,0,1080,1920);x.fillStyle="#fff";x.font="bold 64px system-ui";x.textAlign="center";const words=value.split(/\s+/);let lines=[],line="";for(const w of words){const t=line?line+" "+w:w;if(x.measureText(t).width>850&&line){lines.push(line);line=w}else line=t}if(line)lines.push(line);lines.forEach((l,i)=>x.fillText(l,540,900+(i-lines.length/2)*90));c.toBlob(b=>review(new File([b],"cloudy-text.jpg",{type:"image/jpeg"}),"text",0),"image/jpeg",.92)}};$("bgdot").onclick=()=>{S.bg++;$("hero").style.filter="hue-rotate("+(S.bg*45)+"deg)"};function back(){clear();$("rv").classList.remove("show")}$("rvBack").onclick=back;$("rvCancel").onclick=back;$("rvNext").onclick=()=>{if(!S.last)return;window.parent.dispatchEvent(new CustomEvent("cloudy:captured",{detail:{file:S.last.file,type:S.last.type==="video"?"video":"photo",durationSeconds:S.last.duration}}));back()};$("xBtn").onclick=()=>{clear();window.parent.dispatchEvent(new CustomEvent("cloudy:close"))};window.addEventListener("pagehide",clear)})();</script></body></html>
