<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloudy English</title>
<style>
:root{--ink:#06143a;--sky:#4db3ff;--ice:#cfe9ff;--ok:#38d39a;--bad:#ff6b81;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
body{background:linear-gradient(165deg,#050d2b 0%,#0a2a73 48%,#3aa0ff 100%) fixed;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.i{width:1em;height:1em;display:block;flex:none}
.amb{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.amb b{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(207,233,255,.35),transparent 70%);animation:drift 16s ease-in-out infinite alternate}
.amb b:nth-child(1){width:360px;height:360px;left:-120px;top:10%}
.amb b:nth-child(2){width:300px;height:300px;right:-100px;top:45%;animation-delay:-5s}
.amb b:nth-child(3){width:420px;height:420px;left:20%;bottom:-160px;animation-delay:-9s}
@keyframes drift{to{transform:translate(50px,-60px) scale(1.15)}}
.btn.ghost{background:rgba(255,255,255,.15);color:#fff;box-shadow:none}.btn.sm{width:auto;padding:12px 18px}.btn.ld{pointer-events:none;opacity:.7}
.fm{text-align:left;margin:16px 0 0}.fm label{display:block;font-weight:700;font-size:14px;margin-bottom:12px}.fm input,.cin input{width:100%;margin-top:6px;padding:14px;border-radius:14px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:inherit;font:inherit;font-size:16px;outline:0;transition:border-color .25s,background .25s}.fm input:focus,.cin input:focus{border-color:#fff;background:rgba(255,255,255,.18)}
.err{min-height:22px;color:#ff9aab;font-weight:700;margin-bottom:8px;text-align:center}.shk{animation:shake .45s}.or{opacity:.7;margin:14px 0}
.ti{background:rgba(255,255,255,.15);border:0;border-radius:10px;padding:8px;color:inherit;font:inherit}
.big.rec{animation:recp 1s infinite}@keyframes recp{50%{box-shadow:0 7px 0 #1a58b5,0 0 0 18px rgba(255,255,255,.25)}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.cd{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:rgba(255,255,255,.1);animation:pop .4s both}.cd.on{background:rgba(255,211,90,.22);font-size:20px}
.rem{display:flex;align-items:center;gap:12px;font-size:34px;margin-top:14px}.rem .i{animation:wob 1.2s infinite}.rem small{font-size:13px;opacity:.85}.rem b{font-size:17px}
.ai{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;color:inherit;margin-top:14px}.ai .ms{width:56px}
.lgc{display:flex;align-items:center;gap:14px}.mdl{font-size:56px;display:flex;animation:float 3s infinite}.lr{animation:rise2 .5s both}.lr.me{background:rgba(255,255,255,.2);border-radius:12px;padding:10px 8px}
.ag{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;text-align:center}.bd{font-size:30px;display:flex;flex-direction:column;align-items:center;gap:4px;filter:grayscale(1);opacity:.35}.bd.on{filter:none;opacity:1;animation:pop .6s both}.bd small{font-size:10px;font-weight:700}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;background:#fff;color:#0a2a73;padding:12px 18px;border-radius:16px;font-weight:800;z-index:50;animation:tst 3.1s both}@keyframes tst{0%{transform:translate(-50%,-90px)}12%,85%{transform:translate(-50%,0)}100%{transform:translate(-50%,-90px)}}
#msgs{padding-bottom:24px}.chat-shell{height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;padding:calc(10px + env(safe-area-inset-top,0px)) 18px calc(10px + env(safe-area-inset-bottom,0px));position:relative;z-index:1}.chat-shell .top{flex:none}.chat-messages{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 0 18px;scrollbar-width:none}.chat-messages::-webkit-scrollbar{display:none}.chat-composer{flex:none;display:flex;gap:10px;align-items:center;padding:10px 0 0;background:transparent}.chat-composer input{flex:1;min-width:0;margin:0;padding:14px;border-radius:16px;border:1px solid rgba(255,255,255,.22);background:rgba(6,20,58,.5);color:inherit;font:inherit;font-size:16px;outline:0}.chat-composer .spk{flex:none}.chat-typing{display:inline-flex;align-items:center;gap:5px;min-width:48px}.chat-typing i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.35;animation:chatDot 1s infinite}.chat-typing i:nth-child(2){animation-delay:.15s}.chat-typing i:nth-child(3){animation-delay:.3s}@keyframes chatDot{50%{opacity:1;transform:translateY(-3px)}}.chat-type-cursor:after{content:' ';display:inline-block;width:2px;height:1em;background:currentColor;vertical-align:-2px;margin-left:2px;animation:cursorBlink .8s steps(2) infinite}@keyframes cursorBlink{50%{opacity:0}}.bub{max-width:84%;padding:12px 15px;border-radius:18px;margin:8px 0;line-height:1.35;animation:rise2 .4s both;white-space:pre-wrap}.bub.a{background:#fff;color:#0a2a73;border-bottom-left-radius:4px}.bub.u{background:linear-gradient(#5bbcff,#2d86f2);margin-left:auto;border-bottom-right-radius:4px}.bub.typ{animation:blk 1s infinite}@keyframes blk{50%{opacity:.3}}
.cin{display:flex;gap:10px;align-items:center;background:rgba(6,20,58,.88);backdrop-filter:blur(14px);border-radius:0}.cin input{margin:0}
body[data-th=light]{background:linear-gradient(165deg,#fff 0%,#dff0ff 45%,#8fcaff 100%) fixed!important;color:#06143a}
body[data-th=light] .pill,body[data-th=light] .card,body[data-th=light] .av,body[data-th=light] .chest:not(.rdy){background:rgba(255,255,255,.75);color:#06143a}
body[data-th=light] .opt:not(.sel):not(.good):not(.wrong){background:rgba(255,255,255,.75);border-color:rgba(10,42,115,.25);color:#06143a}
body[data-th=light] .bar,body[data-th=light] .pb{background:rgba(10,42,115,.15)}body[data-th=light] .bar i,body[data-th=light] .pb i{background:linear-gradient(90deg,#4db3ff,#1f6fe0)}
body[data-th=light] .x,body[data-th=light] nav button{color:#06143a}body[data-th=light] nav{background:rgba(255,255,255,.88);border-color:rgba(10,42,115,.15)}
body[data-th=light] .sw{background:rgba(10,42,115,.25)}body[data-th=light] .sw.on{background:#2d86f2}
body[data-th=light] .seg button{background:rgba(10,42,115,.1);color:#06143a}body[data-th=light] .seg button.on{background:#fff;color:#1f6fe0}
body[data-th=light] .btn{background:#1f6fe0;color:#fff;box-shadow:0 5px 0 #1747a3}body[data-th=light] .btn.ghost,body[data-th=light] .btn[style]{background:rgba(10,42,115,.1)!important;color:#0a2a73!important;box-shadow:none}
body[data-th=light] .sh{background:#fff;color:#06143a}body[data-th=light] .gr .t{stroke:rgba(10,42,115,.15)}body[data-th=light] .gr .p{stroke:#1f6fe0}
body[data-th=light] .ans{border-color:rgba(10,42,115,.35)}body[data-th=light] .row+.row{border-color:rgba(10,42,115,.12)}
body[data-th=light] .fm input,body[data-th=light] .ti,body[data-th=light] .cin input{background:rgba(255,255,255,.9);color:#06143a;border-color:rgba(10,42,115,.25)}body[data-th=light] .cin{background:rgba(255,255,255,.92)}
body[data-th=light] .chip{border:1px solid rgba(10,42,115,.2)}body[data-th=light] .lr.me{background:rgba(31,111,224,.15)}body[data-th=light] .cd{background:rgba(10,42,115,.08)}
.amb u{position:absolute;border-radius:50%;text-decoration:none}
[data-lv=A1] .amb u{background:radial-gradient(circle,rgba(207,233,255,.35),transparent 70%);animation:drift 16s ease-in-out infinite alternate}
[data-lv=A2] .amb u{top:0!important;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.55),rgba(255,255,255,.08));animation:bub 10s ease-in infinite}
[data-lv=B1] .amb u{background:#fff;box-shadow:0 0 10px 2px rgba(207,233,255,.9);animation:twk 3s ease-in-out infinite}
[data-lv=B2] .amb u{width:160%!important;height:90px!important;left:-30%!important;border-radius:60px;background:linear-gradient(90deg,transparent,rgba(160,215,255,.4),rgba(255,255,255,.35),transparent);filter:blur(26px);animation:aur 14s ease-in-out infinite alternate}
@keyframes bub{from{transform:translateY(105vh);opacity:0}15%{opacity:1}to{transform:translateY(-20vh);opacity:0}}
@keyframes twk{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}
@keyframes aur{from{transform:translateX(-8%) rotate(-8deg)}to{transform:translateX(8%) rotate(6deg) scaleY(1.5)}}
body[data-lv=A2]{background:linear-gradient(165deg,#04203d 0%,#07578c 50%,#58d2ec 100%) fixed}
body[data-lv=B1]{background:linear-gradient(165deg,#0b1040 0%,#2b3fb5 50%,#9db8ff 100%) fixed}
body[data-lv=B2]{background:linear-gradient(165deg,#030818 0%,#12327f 48%,#d4e8ff 100%) fixed}
[data-lv=A2] .ring{animation:spin 3s linear infinite reverse}
[data-lv=B1] .ring circle{stroke-dasharray:6 14}
[data-lv=B2] .ring{animation-duration:3.5s}[data-lv=B2] .ring circle{stroke-dasharray:50 30}
[data-lv=A1] .en{animation:float 3s ease-in-out infinite}[data-lv=A2] .en{animation:bnc 1.5s ease-in-out infinite}[data-lv=B1] .en{animation:glw 2s infinite}[data-lv=B2] .en{animation:glw 3s infinite}
.lc{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:20px;background:linear-gradient(#fff,var(--ice));color:#1f6fe0;flex:none}
.lc.A1{animation:float 3s ease-in-out infinite}.lc.A2{animation:bnc 1.5s ease-in-out infinite}.lc.B1{animation:glw 2s infinite}.lc.B2{background:linear-gradient(110deg,#fff 30%,#8fd0ff 50%,#fff 70%);background-size:250% 100%;animation:shm 2.4s linear infinite}
@keyframes bnc{50%{transform:translateY(-8px) scale(1.06)}}@keyframes glw{50%{box-shadow:0 0 0 8px rgba(255,255,255,.25),0 0 18px #fff}}@keyframes shm{to{background-position:-250% 0}}
.opt.lv{display:flex;align-items:center;gap:14px;text-align:left}.opt.lv small{opacity:.8;font-weight:600;font-size:13px}
.spl{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(3,10,35,.85);backdrop-filter:blur(8px);animation:splash 1.7s both;pointer-events:none}
@keyframes splash{0%{opacity:0}15%,80%{opacity:1}100%{opacity:0}}
.spl .lc{width:110px;height:110px;font-size:44px;border-radius:32px}
.spl.A1 .lc{animation:zA1 1s cubic-bezier(.2,.9,.3,1.3) both}.spl.A2 .lc{animation:zA2 1s cubic-bezier(.2,.9,.3,1.2) both}.spl.B1 .lc{animation:zB1 1s cubic-bezier(.2,.9,.3,1.2) both}.spl.B2 .lc{animation:zB2 1s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes zA1{from{transform:scale(.3);opacity:0}}@keyframes zA2{from{transform:rotate(-180deg) scale(.3);opacity:0}}@keyframes zB1{from{transform:perspective(400px) rotateY(180deg) scale(.5);opacity:0}}@keyframes zB2{from{transform:translateY(90px) scale(.6);opacity:0}}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;z-index:1}
.scr{padding:14px 18px 120px;animation:in .55s cubic-bezier(.2,.8,.2,1)}
.scr.na{animation:none}
@keyframes in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
.stats{display:flex;gap:8px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);font-size:24px;display:grid;place-items:center;transition:transform .25s}
.av:active{transform:scale(.9)}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);padding:8px 13px;border-radius:99px;font-weight:800;font-size:16px}
.pill .i{font-size:20px}.sp{flex:1}
.en{background:#fff;color:#0a2a73;border-radius:6px;padding:1px 6px;font-size:13px}
.ban{display:flex;align-items:stretch;margin:22px 0 14px;border-radius:20px;background:linear-gradient(135deg,#63c1ff,#2c7bef);box-shadow:0 5px 0 #1a58b5,0 12px 24px rgba(0,0,0,.25);animation:in .6s both}
.ban>div{flex:1;padding:14px 18px}.ban small{font-weight:800;font-size:12px;letter-spacing:1px;opacity:.8}.ban h3{margin:2px 0 0;font-size:21px}
.gd{border:0;border-left:2px solid rgba(0,0,0,.18);background:none;padding:0 18px;font-size:28px;border-radius:0 20px 20px 0;transition:background .2s}
.gd:active{background:rgba(255,255,255,.2)}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;padding:10px 0 20px}
.nw{text-align:center;position:relative;animation:rise .7s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:var(--d);transform:translateX(var(--x))}
@keyframes rise{from{opacity:0;transform:translate(var(--x),26px) scale(.8)}to{opacity:1;transform:translate(var(--x),0)}}
.node{position:relative;width:80px;height:80px;border-radius:50%;border:0;font-size:36px;display:grid;place-items:center;color:#fff;background:linear-gradient(#6cc6ff,#2d86f2);box-shadow:0 7px 0 #1a58b5,0 14px 22px rgba(0,0,0,.3);transition:transform .18s cubic-bezier(.3,1.4,.5,1),box-shadow .18s}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 #1a58b5}
.node.done{background:linear-gradient(#fff,var(--ice));color:#1f6fe0;box-shadow:0 7px 0 #8fbfe8,0 14px 22px rgba(0,0,0,.3)}
.node.lock{background:rgba(120,140,185,.55);color:rgba(255,255,255,.55);box-shadow:0 7px 0 rgba(20,40,100,.55)}
.ring{position:absolute;inset:-10px;width:100px;height:100px;animation:spin 7s linear infinite}
.ring circle{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:110 180}
@keyframes spin{to{transform:rotate(360deg)}}
.tip{position:absolute;left:50%;top:-44px;transform:translateX(-50%);background:#fff;color:#1f6fe0;font-weight:800;font-size:14px;padding:7px 14px;border-radius:12px;animation:bob 1.6s ease-in-out infinite;z-index:2}
.tip:after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:2px}
@keyframes bob{50%{transform:translate(-50%,-7px)}}
.lb{margin-top:10px;font-weight:700;font-size:14px;opacity:.9}
.deco{position:absolute;right:-6px;bottom:6px;width:120px;opacity:.28;animation:float 5s ease-in-out infinite}
.chest{display:flex;flex-direction:column;align-items:center;gap:2px;width:84px;padding:8px 6px;border:0;border-radius:18px;background:rgba(255,255,255,.14);font-weight:800;font-size:12px;transition:transform .2s}
.chest .i{font-size:40px;filter:grayscale(.8) opacity(.7);transition:filter .4s}
.chest.rdy{background:linear-gradient(#8a63ff,#5a35d8);animation:glow 1.6s infinite}
.chest.rdy .i{filter:none;animation:wob 1.2s infinite}
.chest.got{opacity:.6}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(138,99,255,0)}0%{box-shadow:0 0 0 0 rgba(138,99,255,.6)}}
@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(6,20,58,.72);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.12);z-index:5}
nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:14px;font-size:26px;opacity:.6;transition:all .35s cubic-bezier(.3,1.2,.5,1)}
nav button span{font-size:11px;font-weight:700}
nav button.on{opacity:1;background:rgba(255,255,255,.18);transform:translateY(-3px)}
.card{background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border-radius:20px;padding:16px;margin-bottom:14px;animation:in .6s both}
.card h3{margin:0 0 12px;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.grid .card{margin:0;display:flex;align-items:center;gap:10px;font-size:26px}
.grid b{font-size:20px;display:block;line-height:1}.grid small{font-size:12px;opacity:.8;font-weight:600}
.pc{text-align:center}.pc .ms{width:130px}.pc h2{margin:6px 0 2px}.pc p{margin:0 0 16px;opacity:.8}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-weight:700}
.row+.row{border-top:1px solid rgba(255,255,255,.12)}
.sw{width:52px;height:30px;border-radius:15px;border:0;background:rgba(255,255,255,.25);position:relative;transition:background .3s;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.sw.on{background:var(--sky)}.sw.on i{transform:translateX(22px)}
input[type=range]{width:140px;accent-color:#fff}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:10px 0;border:0;border-radius:12px;background:rgba(255,255,255,.14);font-weight:800;transition:all .3s}
.seg button.on{background:#fff;color:#1f6fe0;transform:scale(1.05)}
.goal{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.gr{width:96px;height:96px;flex:none}.gr circle{fill:none;stroke-width:10;stroke-linecap:round}

@keyframes draw{from{stroke-dashoffset:var(--c)}}
.q{margin-bottom:16px}.q p{margin:0 0 8px;font-weight:700;display:flex;justify-content:space-between}
.pb{height:14px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}

@keyframes grow{from{width:0}}@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.top{display:flex;align-items:center;gap:12px;padding:6px 0}
.x{background:none;border:0;font-size:28px;opacity:.85}
.bar{flex:1;height:16px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}

.hp{display:flex;align-items:center;gap:5px;font-weight:800;font-size:18px;color:#ff8da1}.hp .i{font-size:24px}

.cb{background:linear-gradient(#ffd35a,#ff8a3d);color:#5a2a00;padding:3px 9px;border-radius:99px;font-weight:800;font-size:13px;animation:pop .35s}
.body{margin-top:22px}
h2{font-size:21px;margin:0 0 16px}
.qq{font-size:32px;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:12px}
.spk{width:46px;height:46px;border-radius:50%;border:0;background:#fff;color:#1f6fe0;font-size:24px;display:grid;place-items:center;box-shadow:0 4px 0 #8fbfe8;transition:transform .15s}
.spk:active{transform:scale(.9)}

.opt.sel{background:rgba(207,233,255,.3);border-color:var(--ice);transform:translateY(-2px)}
.opt.good{background:rgba(56,211,154,.3);border-color:var(--ok)}

.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mt .opt{text-align:center;padding:16px 8px}
.ans{min-height:64px;border-bottom:2px solid rgba(255,255,255,.4);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0;margin-bottom:22px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{padding:10px 16px;font-size:18px;font-weight:700;border-radius:14px;border:0;background:#fff;color:var(--ink);box-shadow:0 4px 0 #8fbfe8;animation:pop .3s;transition:transform .15s}
.chip:active{transform:translateY(3px)}.chip.gone{visibility:hidden}
.foot{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;z-index:6}
.foot.ok{background:#d8fbea;color:#0b6b44;animation:up .45s cubic-bezier(.2,.9,.3,1)}
.foot.bad{background:#ffe1e6;color:#a3243b;animation:up .45s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.foot p{margin:0 0 12px;font-weight:800;font-size:18px}
.btn{width:100%;padding:16px;border:0;border-radius:16px;font-size:17px;font-weight:800;letter-spacing:.5px;color:#0a2a73;background:#fff;box-shadow:0 5px 0 #8fbfe8;transition:transform .12s,opacity .3s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8fbfe8}.btn:disabled{opacity:.4}
.foot.ok .btn{background:var(--ok);color:#fff;box-shadow:0 5px 0 #1f9d68}
.foot.bad .btn{background:var(--bad);color:#fff;box-shadow:0 5px 0 #c23a52}
.res{text-align:center;padding-top:34px}
.ms{width:150px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-9px)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.big2{font-size:30px;font-weight:800;margin:14px 0}
.stars{display:flex;justify-content:center;gap:8px;font-size:58px;margin:6px 0 18px}
.stars .i{animation:pop .7s both}
.rs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.rs div{background:rgba(255,255,255,.14);border-radius:16px;padding:12px 4px;font-weight:800;font-size:22px;animation:rise2 .6s both}
.rs small{display:block;font-size:11px;opacity:.8;margin-top:2px}
.sb{position:fixed;inset:0;background:rgba(3,10,35,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .3s;z-index:20}
.sh{width:100%;max-width:480px;background:linear-gradient(#10409f,#0a2a73);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:sheet .5s cubic-bezier(.2,.9,.3,1);max-height:82vh;overflow:auto}
.sh h3{margin:0 0 12px;font-size:20px}.sh .row .spk{width:38px;height:38px;font-size:20px}
@keyframes sheet{from{transform:translateY(100%)}}
.sb.out{animation:fadeo .3s forwards}.sb.out .sh{animation:sheeto .3s forwards}
@keyframes fadeo{to{opacity:0}}@keyframes sheeto{to{transform:translateY(100%)}}
.cf{position:fixed;top:-24px;border-radius:2px;pointer-events:none;z-index:30;animation:fall var(--t) cubic-bezier(.3,.5,.5,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 for(let i=1;i<=a.length;i++){let diagonal=prev[0];prev[0]=i;for(let j=1;j<=b.length;j++){const above=prev[j];prev[j]=Math.min(prev[j]+1,prev[j-1]+1,diagonal+(a[i-1]===b[j-1]?0:1));diagonal=above;}}
 return prev[b.length];
}
function speechMatches(transcript,target){
 const heard=normalizeSpeechText(transcript),expected=normalizeSpeechText(target);
 if(!heard||!expected)return false;
 // Short English words often differ by a single phoneme (son/sun, ship/sheep).
 // Browser ASR's fuzzy transcript matching cannot safely distinguish them.
 if(heard===expected)return true;
 if(expected.includes(" "))return false;
 if(expected.length<5)return false;
 return Math.abs(heard.length-expected.length)<=1&&speechDistance(heard,expected)<=1;
}

function mk(l){const r=[],modes=sh([0,0,1,1,2,2]);
 const titles={
  ru:["Переведите на английский","Как сказать это по-английски?","Выберите английский перевод"],
  en:["Что это значит?","Выберите перевод слова","Как переводится это слово?"],
  listen:["Что вы услышали?","Прослушайте и выберите слово","Какое слово произнесено?"],
  bank:["Составьте предложение на английском","Переведите фразу на английский","Соберите правильный перевод"]
 };
 l.w.forEach(([en,ru])=>{const m=modes.pop(),o=sh([[en,ru],...sh(pool().filter(x=>x[0]!=en)).slice(0,3)]);
  if(m==2)r.push({k:"l",a:en,en,o:o.map(x=>x[0]),title:titles.listen[Math.random()*titles.listen.length|0]});
  else r.push({k:"c",q:m?en:ru,a:m?ru:en,en,spk:!!m,o:o.map(x=>m?x[1]:x[0]),title:(m?titles.en:titles.ru)[Math.random()*(m?titles.en:titles.ru).length|0]})});
 const p=sh(l.w).slice(0,4);r.push({k:"m",L:sh(p.map(x=>[x[0],x[0]])),R:sh(p.map(x=>[x[1],x[0]])),title:"Найдите пары"});
 l.s.forEach(([ru,en,d])=>r.push({k:"b",q:ru,a:en,o:sh([...en.split(" "),...d.split(" ")]),title:titles.bank[Math.random()*titles.bank.length|0]}));
 if(l.w.length&&(window.SpeechRecognition||window.webkitSpeechRecognition)&&S.set.mic)r.push({k:"p",en:sh(l.w)[0][0]});return sh(r)}
function go(n){snd("go");rv=0;lm=[];rt=0;L=n;ex=window.CloudyLearning?CloudyLearning.prioritize(KEY,mk(D[n])):mk(D[n]);i=0;hp=5;cmb=0;ok=0;tot=0;draw()}
const opts=e=>e.o.map((o,k)=>`<button class="opt" style="--i:${k}" onclick="pick(${k})">${o}</button>`).join("");
function draw(){const e=ex[i];sel=null;built=[];done=false;ml=null;mc=0;let b;
 if(e.k=="c")b=`<h2>${e.title}</h2><div class="qq">${e.q}${e.spk?`<button class="spk" onclick="say('${e.en}',1)">${ic("spk")}</button>`:""}</div>${opts(e)}`;
 else if(e.k=="l")b=`<h2>${e.title}</h2><button class="big" onclick="say('${e.en}',1)">${ic("spk")}</button>${opts(e)}`;
 else if(e.k=="b")b=`<h2>${e.title}</h2><div class="qq" style="font-size:24px">${e.q}</div><div class="ans" id="ans"></div><div class="bank">${e.o.map((o,k)=>`<button class="chip" id="c${k}" onclick="tog(${k})">${o}</button>`).join("")}</div>`;
 else if(e.k=="p")b=PB(e);else b=`<h2>${e.title||"Найдите пары"}</h2><div class="mt"><div>${e.L.map(([t,id],k)=>`<button class="opt" style="--i:${k}" onclick="mp(0,'${id}',this)">${t}</button>`).join("")}</div><div>${e.R.map(([t,id],k)=>`<button class="opt" style="--i:${k}" onclick="mp(1,'${id}',this)">${t}</button>`).join("")}</div></div>`;
 app.innerHTML=`<div class="scr"><div class="top"><button class="x" onclick="snd('tab');view()">${ic("x")}</button><div class="bar"><i style="width:${i/ex.length*100}%"></i></div><span class="hp" id="hp">${ic("heart")}${hp}</span></div><div class="body">${b}</div></div>`+(e.k=="m"||e.k=="p"?'<div class="foot" id="ft" style="display:none"></div>':`<div class="foot" id="ft"><button class="btn" id="go" disabled onclick="check()">ПРОВЕРИТЬ</button></div>`);
 requestAnimationFrame(()=>{const f=$(".bar i");if(f)f.style.width=i/ex.length*100+"%"});
 if(e.k=="l")setTimeout(()=>say(e.en,1),400);if(e.k=="c"&&e.spk)setTimeout(()=>say(e.en),400)}
function pick(k){if(done)return;sel=k;snd("pick");document.querySelectorAll(".opt").forEach((b,j)=>b.classList.toggle("sel",j==k));$("#go").disabled=false}
function tog(k){if(done)return;snd("tap");const p=built.indexOf(k);p>-1?built.splice(p,1):built.push(k);const e=ex[i];$("#ans").innerHTML=built.map(j=>`<button class="chip" onclick="tog(${j})">${e.o[j]}</button>`).join("");e.o.forEach((_,j)=>$("#c"+j).classList.toggle("gone",built.includes(j)));$("#go").disabled=!built.length}
function miss(){hp--;cmb=0;tot++;snd("bad");const h=$("#hp");h.innerHTML=ic("heart")+hp;h.classList.remove("hit");void h.offsetWidth;h.classList.add("hit");if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}}
function fx(good,msg){done=true;const ft=$("#ft");ft.style.display="";ft.className="foot "+(good?"ok":"bad");ft.innerHTML=`<p>${msg}</p><button class="btn" onclick="next()">ДАЛЬШЕ</button>`;if(good)$(".bar i").style.width=(i+1)/ex.length*100+"%"}
function check(){if(done)return;const e=ex[i];
 const good=e.k=="b"?built.map(j=>e.o[j]).join(" ").toLowerCase()==e.a.toLowerCase():e.o[sel]==e.a;
 if(window.CloudyLearning)CloudyLearning.record(KEY,e,good,{retry:!!rt});
 if(e.k!="b")document.querySelectorAll(".opt").forEach((b,j)=>{if(e.o[j]==e.a)b.classList.add("good");else if(j==sel)b.classList.add("wrong")});
 if(good){ok++;tot++;cmb++;snd("ok",cmb);if(rv&&e.en&&S.mis[e.en]){if(--S.mis[e.en]<=0)delete S.mis[e.en];save()}setTimeout(()=>say(e.en||e.a),300);if(cmb>=3){const t=$(".top");if(!$(".cb"))t.insertAdjacentHTML("beforeend",'<span class="cb"></span>');$(".cb").textContent="x"+cmb}}else{addMis(e.en);miss();$(".cb")&&$(".cb").remove()}
 fx(good,good?["Отлично!","Верно!","Супер!","Так держать!"][Math.random()*4|0]:"Правильный ответ: "+e.a)}
function mp(side,id,el){if(done||el.classList.contains("good"))return;
 if(side==0){snd("pick");ml=[id,el];document.querySelectorAll(".mt .opt").forEach(b=>b.classList.remove("sel"));el.classList.add("sel");return}
 if(!ml)return;const l=ml[1];
 if(ml[0]==id){if(window.CloudyLearning)CloudyLearning.record(KEY,{k:"c",en:id},true,{retry:!!rt});l.classList.remove("sel");l.classList.add("good");el.classList.add("good");snd("match");ml=null;if(++mc==ex[i].L.length){ok++;tot++;cmb++;setTimeout(()=>{snd("ok",cmb);fx(true,"Все пары найдены!")},350)}}
 else{if(window.CloudyLearning)CloudyLearning.record(KEY,{k:"c",en:ml[0]},false,{retry:!!rt});[l,el].forEach(b=>{b.classList.add("wrong");setTimeout(()=>b.classList.remove("wrong"),500)});l.classList.remove("sel");addMis(ml[0]);ml=null;miss();if(hp<=0)setTimeout(fail,800)}}
function next(){if(hp<=0)return fail();snd("tap");if(++i>=ex.length&&!rt&&lm.length){rt=1;lm.slice(0,3).forEach(en=>ex.push(cq(en,ruOf(en),Math.random()*2|0)))}if(i>=ex.length)return fin();draw()}
function fail(){snd("bad");app.innerHTML=`<div class="scr res">${mascot("s")}<div class="big2">Жизни закончились</div><p style="opacity:.85">Ничего страшного, попробуем ещё раз.</p><br><button class="btn" onclick="again()">ПОПРОБОВАТЬ СНОВА</button><br><br><button class="btn" onclick="view()" style="background:rgba(255,255,255,.15);color:#fff;box-shadow:none">НА ГЛАВНУЮ</button></div>`}
function fin(){roll();const t=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString(),gain=cloudUserId?24:15+hp*3,st=hp>=5?3:hp>=3?2:1,acc=Math.round(ok/Math.max(tot,1)*100);
 if(S.last!=t){S.streak=S.last==y?S.streak+1:1;S.last=t}
 if(!cloudUserId){S.xp+=gain;S.td.xp+=gain;track(gain)}
 S.td.les++;S.td.ok+=ok;S.acc[0]+=ok;S.acc[1]+=tot;const ps=SEC.flatMap(s=>s.l);if(ps.indexOf(L)==S.dn[S.lv]&&S.dn[S.lv]<ps.length)S.dn[S.lv]++;save();if(!cloudUserId)checkAch();
 app.innerHTML=`<div class="scr res">${mascot()}<div class="big2">Урок пройден!</div><div class="stars">${[0,1,2].map(k=>`<span style="animation-delay:${.3+k*.3}s;display:block">${ic(k<st?"starg":"stard")}</span>`).join("")}</div><div class="rs"><div style="animation-delay:.2s"><span id="xp">+0</span><small>XP</small></div><div style="animation-delay:.35s">${acc}%<small>точность</small></div><div style="animation-delay:.5s">${S.streak}<small>серия</small></div></div><button class="btn" onclick="snd('tab');T=0;view()">ПРОДОЛЖИТЬ</button></div>`;
 snd("win");conf();for(let k=0;k<st;k++)setTimeout(()=>snd("star"),300+k*300);
 if(cloudUserId){window.parent.postMessage({channel:'cloudy-auth',type:'lesson-complete',lessonIndex:L,level:S.lv},location.origin);return}
 const el=$("#xp"),s0=performance.now();(function f(n){const p=Math.min((n-s0)/1000,1);el.textContent="+"+Math.round(gain*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(s0)}
view();
</script>
<script id="cloudy-admin-runtime" src="/cloudy-admin.js"></script>
