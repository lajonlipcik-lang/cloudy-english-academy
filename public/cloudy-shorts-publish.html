<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Cloudy Shorts — публикация</title><style>
:root{--ac:#5bb8ff;--ac2:#2f7bff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;background:#050c24;color:#fff;font-family:Inter,"SF Pro Display",system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow:hidden}.app{height:100dvh;max-width:480px;margin:auto;background:#050c24;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom))}.top{height:44px;display:flex;align-items:center;gap:12px}.top button{width:38px;height:38px;border:0;border-radius:50%;background:#ffffff18;color:#fff;font-size:23px}.top b{font-size:17px}.body{flex:1;overflow:auto;padding:10px 0 16px}.cap{width:100%;height:105px;resize:none;background:transparent;border:0;border-bottom:1px solid #294362;color:#fff;font:15px/1.5 inherit;outline:none;padding:10px 2px}.cnt{text-align:right;color:#9db1c8;font-size:11px;margin:5px 0 14px}.card{height:250px;border-radius:18px;overflow:hidden;background:#101f35;display:grid;place-items:center;position:relative}.card video,.card img{width:100%;height:100%;object-fit:contain}.card .empty{color:#a9bfd7}.row{display:flex;align-items:center;justify-content:space-between;padding:17px 2px;border-bottom:1px solid #233a55;color:#e9f4ff;font-size:14px}.row small{color:#92a9c3}.footer{display:flex;gap:10px;padding-top:10px}.footer button{height:50px;border:0;border-radius:14px;font-weight:850;flex:1;background:#203957;color:#fff}.footer #post{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#041326}.sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:3}.sheet.show{display:flex}.panel{width:100%;max-width:480px;margin:auto;background:#10213c;border-radius:22px 22px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom))}.panel h3{margin:0 0 18px}.panel button{margin-top:12px;padding:12px 18px;border:0;border-radius:12px;background:#263f5e;color:white}.prog{position:fixed;inset:0;background:#050c24;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;z-index:5}.prog.show{display:flex}.bar{height:8px;width:100%;max-width:340px;border-radius:9px;background:#263a54;overflow:hidden;margin:20px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2))}.pick{display:none}.toast{position:fixed;left:18px;right:18px;bottom:20px;background:#263a54;padding:12px;border-radius:12px;text-align:center;display:none}
</style></head><body><main class="app"><header class="top"><button id="back">‹</button><b>Публикация</b></header><section class="body"><textarea class="cap" id="cap" maxlength="180" placeholder="Добавь описание…"></textarea><div class="cnt" id="cnt">0 / 180</div><div class="card" id="card"><div class="empty">Предпросмотр публикации</div><video id="pvV" playsinline controls hidden></video><img id="pvI" hidden alt="Предпросмотр"></div><button id="cvBtn" style="margin-top:10px;background:transparent;border:0;color:#8dcfff">Изменить обложку</button><div class="row" id="hash"><span>Добавить хэштеги</span><small>#</small></div><div class="row" id="ment"><span>Отметить людей</span><small>@</small></div><div class="row" id="rLink"><span>Добавить ссылку</span><small id="linkVal">Необязательно</small></div><div class="row" id="rPriv"><span>Кто может смотреть</span><small id="privVal">Все</small></div><div class="row" id="rMore"><span>Дополнительные настройки</span><small>›</small></div><div class="row" id="rShare"><span>Поделиться после публикации</span><small id="shareVal">Выкл.</small></div><div class="pick" id="pick">Выбери видео<input id="file" type="file" accept="video/*,image/*"></div></section><footer class="footer"><button id="draft">Черновик</button><button id="post">Опубликовать</button></footer></main><div class="sheet" id="sheet"><div class="panel"><h3 id="sheetTitle">Настройки</h3><div id="sheetBody"></div><button id="sheetClose">Готово</button></div></div><div class="prog" id="prog"><b id="progTitle">Публикуем…</b><div class="bar"><i id="bar"></i></div><small id="progText">Загружаем в Cloudy Shorts</small><button id="pdone" style="display:none;margin-top:22px;padding:13px 25px;border:0;border-radius:12px;background:#5bb8ff;color:#041326;font-weight:800">Готово</button></div><div class="toast" id="toast"></div>
<script>(()=>{const $=id=>document.getElementById(id),S={file:null,type:"video",url:null,dur:0,priv:"all",com:true,dl:true,share:false,link:"",cover:null};function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2200)}function revoke(){if(S.url){URL.revokeObjectURL(S.url);S.url=null}}function load(file,type,duration){revoke();S.file=file;S.type=type==="video"?"video":"photo";S.dur=duration||0;S.url=URL.createObjectURL(file);$("pick").style.display="none";$("pvV").hidden=S.type!=="video";$("pvI").hidden=S.type==="video";if(S.type==="video"){$("pvV").src=S.url;$("pvV").load()}else{$("pvI").src=S.url;S.cover=file}}window.cloudyPublishOpen=load;window.cloudyPublishProgress=n=>{$("prog").classList.add("show");$("bar").style.width=Math.max(0,Math.min(100,Number(n)||0))+"%";$("progText").textContent=n>=100?"Проверка завершена":"Загружаем в Cloudy Shorts"};window.cloudyPublishDone=()=>{$("progTitle").textContent="Готово";$("progText").textContent="Публикация отправлена";$("pdone").style.display="block";$("prog").classList.add("show")};$("pdone").onclick=()=>{revoke();window.parent.dispatchEvent(new CustomEvent("cloudy:published"))};$("cap").oninput=()=>{$("cnt").textContent=$("cap").value.length+" / 180"};function sheet(title,content){$("sheetTitle").textContent=title;$("sheetBody").innerHTML=content;$("sheet").classList.add("show")}$("sheetClose").onclick=()=>$("sheet").classList.remove("show");$("rLink").onclick=()=>sheet("Ссылка",'<input id="linkInput" placeholder="https://" style="width:100%;padding:13px;border-radius:10px;background:#09172b;color:white;border:1px solid #456">');$("rPriv").onclick=()=>sheet("Кто может смотреть",'<select id="privInput" style="width:100%;padding:13px;background:#09172b;color:white"><option value="all">Все</option><option value="followers">Подписчики</option><option value="private">Только я</option></select>');$("rMore").onclick=()=>sheet("Дополнительные настройки",'<label><input id="comInput" type="checkbox" '+(S.com?'checked':'')+'> Разрешить комментарии</label><br><br><label><input id="dlInput" type="checkbox" '+(S.dl?'checked':'')+'> Разрешить скачивание</label>');$("rShare").onclick=()=>{S.share=!S.share;$("shareVal").textContent=S.share?"Вкл.":"Выкл."};$("sheetClose").addEventListener("click",()=>{const l=$("linkInput"),p=$("privInput"),c=$("comInput"),d=$("dlInput");if(l){S.link=l.value;$("linkVal").textContent=S.link?"Добавлена":"Необязательно"}if(p){S.priv=p.value;$("privVal").textContent=p.options[p.selectedIndex].text}if(c)S.com=c.checked;if(d)S.dl=d.checked});$("hash").onclick=()=>{const t=prompt("Хэштеги");if(t)$("cap").value=($("cap").value+" "+t).trim();$("cnt").textContent=$("cap").value.length+" / 180"};$("ment").onclick=()=>toast("Отметки можно добавить в описание");$("cvBtn").onclick=()=>toast("Обложка — первый кадр видео или выбранное фото");$("draft").onclick=()=>{if(!S.file){toast("Сначала выбери файл");return}try{localStorage.setItem("cloudy-shorts-draft",JSON.stringify({caption:$("cap").value,privacy:S.priv,comments:S.com,download:S.dl,link:S.link,share:S.share}));toast("Настройки черновика сохранены")}catch(_){toast("Не удалось сохранить черновик")}};$("back").onclick=()=>window.parent.dispatchEvent(new CustomEvent("cloudy:back"));$("post").onclick=()=>{if(!S.file){toast("Не получен файл из съёмки");return}const event=new CustomEvent("cloudy:publish",{cancelable:true,detail:{file:S.file,type:S.type,durationSeconds:S.dur,caption:$("cap").value,cover:S.cover,privacy:S.priv,allowComments:S.com,allowDownload:S.dl,link:S.link,shareAfter:S.share}});const handled=window.parent.dispatchEvent(event);if(handled){toast("Не удалось подключиться к публикации")}else{$("prog").classList.add("show");$("progTitle").textContent="Отправляем публикацию…"}};const draft=(()=>{try{return JSON.parse(localStorage.getItem("cloudy-shorts-draft")||"null")}catch(_){return null}})();if(draft){$("cap").value=draft.caption||"";$("cnt").textContent=$("cap").value.length+" / 180"}window.addEventListener("pagehide",revoke)})();</script></body></html>
