name: Cloudy server checks

on:
  push:
    branches: [flutter-migration]
    paths:
      - "src/**"
      - "drizzle/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build
