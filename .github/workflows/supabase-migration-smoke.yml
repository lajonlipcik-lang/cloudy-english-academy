name: Supabase migration smoke test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [migration/vercel-platform]

permissions:
  contents: write

jobs:
  local-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      # Pin CLI v2 while the repository's migration harness is validated.
      # No Supabase access token, project link, or remote database is used.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Verify no remote project is linked
        run: |
          test ! -f supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_URL:-}"

      - name: Rebuild the full schema on an isolated local Supabase stack
        run: bash scripts/ci/test-supabase-migrations.sh


      - name: Commit CLI-generated canonical migrations
        if: success()
        run: |
          git add supabase/migrations
          if git diff --cached --quiet; then
            echo "Canonical migration history is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(db): add canonical Supabase migration history [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
